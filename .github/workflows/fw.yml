name: Update FAWA M3U

on:
  schedule:
    # Her 2 saatte bir otomatik çalışır (İsteğe göre düzenleyebilirsin)
    - cron: "0 */2 * * *"
  workflow_dispatch: # GitHub arayüzünden manuel tetikleme butonu ekler

permissions:
  contents: write # fawa.m3u dosyasını repoya pushlayabilmek için gerekli izin

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu çek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli kütüphaneleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install httpx selectolax

      - name: Scraper scriptini çalıştır
        run: python fw.py

      - name: Güncellenen fawa.m3u dosyasını kaydet (Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add fawa.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update fawa.m3u" && git push)
