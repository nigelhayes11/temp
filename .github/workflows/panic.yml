name: Update SportsBite M3U

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scripti çalıştır
        run: python sportsbite.py

      - name: M3U dosyasını kaydet ve gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add bite.m3u
          git diff --staged --quiet || (git commit -m "Update bite.m3u" && git push)
