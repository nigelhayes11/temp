name: yeni

on:
  schedule:
    # Her 45 dakikada bir çalışır
    - cron: '*/45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-updater
  cancel-in-progress: true

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu (Repo) İndir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright ve Tarayıcı Bağımlılıklarını Kur
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 1. StreamEast (SportPass) Taraması
        continue-on-error: true
        run: python sportspass.py

      - name: 2. DamiTV Taraması
        continue-on-error: true
        run: python dami.py

      - name: Oluşan M3U ve STRM Dosyalarını Depoya Kaydet
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add *.m3u *.m3u8 strm_streams/ dami_strm/ || true
          
          if ! git diff --staged --quiet; then
            git commit -m "Otomatik yayın güncellemesi: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push
          else
            echo "Listelerde yeni bir değişiklik yok, push atlandı."
          fi
