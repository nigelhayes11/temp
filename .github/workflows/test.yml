name: Update DAMITV M3U

on:
  schedule:
    # Aktif maç penceresini kaçırmamak için her 30 dakikada bir çalışır
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu çek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli kütüphaneleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Scraper scriptini çalıştır
        run: python dami.py

      - name: Güncellenen dami.m3u dosyasını kaydet (Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add dami.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update dami.m3u" && git push)



