name: DamiTV Test ve Guncelle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-dami:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Httpx Kur
        run: pip install httpx

      - name: Dami Betigini Calistir
        run: python dami.py

      - name: Ciktiyi Repoya Kaydet
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add dami.m3u
          if ! git diff --staged --quiet; then
            git commit -m "DamiTV M3U guncellemesi"
            git push origin main
          fi
