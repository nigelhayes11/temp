name: ▶ Update TV Playlist

on:
  schedule:
    # Her saat başı otomatik çalışır
    - cron: '0 * * * *'
  # Manuel olarak başlatma butonunu aktif eder
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dosyayı kaydedip push edebilmek için şart

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download M3U Playlist
        run: |
          # Aşağıdaki URL yerine kendi gerçek M3U linkinizi yapıştırın
          URL="https://ornek-kaynak-linkiniz.com"
          
          # Linkten dosyayı indirir ve tv.m3u adıyla kaydeder
          curl -L -s -o tv.m3u "$URL"

      - name: Check for changes and Commit
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          # tv.m3u dosyasını git takibine ekle
          git add tv.m3u
          
          # Eğer değişiklik varsa commit yap ve pushla
          if ! git diff --cached --quiet; then
            git commit -m "✅ Updated tv.m3u"
            git pull --rebase origin main
            git push
          else
            echo "Herhangi bir değişiklik tespit edilmedi."
          fi
