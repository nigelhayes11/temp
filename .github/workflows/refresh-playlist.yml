name: Refresh playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: refresh-playlist
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5  # v4 yerine v5 yapıldı (Node 24 Uyumlu)
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6  # v5 yerine v6 yapıldı (Node 24 Uyumlu)
        with:
          python-version: "3.13"       # Hata riskini önlemek için stabil güncel sürüme çekildi

      - name: Generate playlist
        run: python madueke.py

      - name: Commit and push updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

          git add madueke.m3u8

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update token: madueke.m3u8"

          # Incorporate any newer commit on GitHub before pushing
          git pull --rebase origin main
          git push origin HEAD:main
