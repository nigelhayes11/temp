name: Tika Scriptini Çalıştır

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# Depoya dosya yazabilmek için gerekli izin
permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Tika Scriptini Çalıştır
        run: python tika.py

      # 5. Oluşan M3U dosyalarını GitHub klasörünüze kaydeder
      - name: M3U Dosyalarını Depoya Kaydet
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add -f cdnlivetv_channels.m3u cdnlivetv_events.m3u
          git commit -m "Otomatik M3U güncellemesi" || echo "Yeni değişiklik yok"
          git push
