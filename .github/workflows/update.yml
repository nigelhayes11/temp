name: Auto Update Sports Playlists

on:
  schedule:
    - cron: '0 * * * *' # Berjalan otomatis setiap 1 jam sekali
  workflow_dispatch: # Bisa dijalankan manual kapan saja

jobs:
  update-sports:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run FawaNews Scraper
        run: python fw.py

      - name: Run RoxieStreams Soccer Scraper
        run: python rx_soccer.py

      - name: Commit & Push Sports Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bangke_list.m3u fawanews.json roxi_soccer.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update sports playlists [skip ci]" && git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main)
