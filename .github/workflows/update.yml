name: Tika Scriptini Çalıştır

on:
  # Manuel olarak GitHub arayüzünden tetiklemek için
  workflow_dispatch:
  # Ana dala (main) her kod gönderildiğinde otomatik çalışması için
  push:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Depodaki dosyaları sanal makineye çeker
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      # 2. Ortama Python kurar
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Gerekli kütüphaneleri yükler
      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Python dosyanızı çalıştırır
      - name: Tika Scriptini Çalıştır
        run: python tika.py
