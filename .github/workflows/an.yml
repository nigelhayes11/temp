name: Update Live M3U Playlist

on:
  schedule:
    # Her 30 dakikada bir otomatik çalışır (İstersen '0 * * * *' yaparak saat başı yapabilirsin)
    - cron: '*/30 * * * *'
  workflow_dispatch: # GitHub Actions sekmesinden manuel tetikleme butonu ekler

permissions:
  contents: write # Repo içine nba.m3u dosyasını yazabilmek için gerekli

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu (Repository) Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları ve Playwright Tarayıcısını Kur
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Betiği Çalıştır
        run: python main.py # Betik dosyanın adı farklıysa burayı güncelle

      - name: Güncellenen nba.m3u Dosyasını Repoya Kaydet
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add nba.m3u
          if ! git diff --staged --quiet; then
            git commit -m "chore: update nba.m3u playlist"
            git push
          else
            echo "Değişiklik yok, commit atılmadı."
          fi
