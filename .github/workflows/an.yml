name: Update STRMFREE M3U

on:
  schedule:
    # Her 2 saatte bir çalışır (Dakika Saat Gün Ay HaftanınGünü)
    - cron: "0 */2 * * *"
  workflow_dispatch: # GitHub Actions sekmesinden manuel tetikleme imkanı sağlar

permissions:
  contents: write # Oluşan .m3u dosyasını repoya kaydedebilmesi için gerekli izin

jobs:
  build-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Betiği Çalıştır
        run: python an.py

      - name: Değişiklikleri Repoya Kaydet (Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add an.m3u
          if ! git diff --staged --quiet; then
            git commit -m "chore: update an.m3u [skip ci]"
            git push
          else
            echo "an.m3u dosyasında değişiklik yok."
          fi
