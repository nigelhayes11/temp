name: PAKETOS

on:
  workflow_dispatch:     # El ile butona basınca ANINDA çalışmasını sağlar
  schedule:
    - cron: '0 */2 * * *' # Tam olarak 2 saatte bir otomatik çalışır (02:00, 04:00, 06:00...)

permissions:
  contents: write        # Dosyaları değiştirip depoya geri yazabilmesi için kesin izin

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      - name: Run fll.py
        run: python fll.py

      # Python kodunun ürettiği dosyaları Git'in görüp görmediğini loglar
      - name: Check file status
        run: git status

      # Değişiklik varsa commit eder, yoksa hata vermeden geçer
      - name: Commit changes
        run: |
          git add .
          git commit -m "Auto-update m3u8 files" || echo "No changes to commit"

      # Uzak sunucudaki güncel hali çekip üzerine yazar ve pushlar
      - name: Push changes
        run: |
          git pull origin main --rebase
          git push origin main
