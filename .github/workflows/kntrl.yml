name: PAKETOS

on: 
  schedule:
    - cron: '0 * * * *' # Her saat başı çalışır
  workflow_dispatch:     # El ile tetikleme açık

permissions:
  contents: write        # Depoya yazma izni (Kesinlikle en üst seviyede kalmalı)

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      # v4 sürümüne yükseltildi (Node uyarılarını siler)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} 

      # v5 sürümüne yükseltildi (Node uyarılarını siler)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run fll.py
        run: python fll.py

      # Python kodunun diske gerçekten dosya yazıp yazmadığını görmek için kritik adım
      - name: Check file status
        run: git status

      - name: Commit changes
        run: |
          git add .
          git commit -m "Auto-update m3u8 files" || echo "No changes to commit"

      - name: Push changes
        run: |
          git pull origin main --rebase
          git push origin main
