name: Kontrol

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  BirlesikGuncelleme:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 # Git geçmişinin tamamını çekerek diff hatalarını önler

      - name: Python 3.11.8 Yükle ve Önbelleğe Al
        uses: actions/setup-python@v5.3.0
        with:
          python-version: 3.11.8
          cache: 'pip' # Her 5 dakikada bir indirme yapmaz, hızlandırır

      - name: Gereksinimleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install Kekik httpx parsel requests cloudscraper beautifulsoup4

      - name: an.py Çalıştır
        continue-on-error: true
        run: python an.py

      - name: selcuk.py Çalıştır
        continue-on-error: true
        run: python selcuk.py

      - name: sa.py Çalıştır
        continue-on-error: true
        run: python sa.py

      - name: rnl.py Çalıştır
        continue-on-error: true
        run: python rnl.py

      - name: fll.py Çalıştır
        continue-on-error: true
        run: python fll.py

      - name: tika.py Çalıştır
        continue-on-error: true
        run: python tika.py

      # Manuel git komutları yerine çakışmaları (conflict) otomatik çözen güvenli commit adımı
      - name: Değişiklikleri Commit ve Push Et
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Kanallar güncellendi\n📺 Domain kontrolü ve M3U güncellemeleri tamamlandı\n🕒 Otomatik işlem - ${{ github.sha }}"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          push_options: '--force' # 5 dakikalık çakışmalarda hata alınmasını engeller
