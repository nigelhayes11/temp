import os
import sys
import re

def parse_m3u(file_path):
    """tv.m3u dosyasını okur, kanal isimlerini ve linklerini ayıklar."""
    if not os.path.exists(file_path):
        print(f"::error::{file_path} dosyası bulunamadı!", file=sys.stderr)
        return []

    channels = []
    current_channel = {}

    print(f"'{file_path}' dosyası ayrıştırılıyor...")
    
    with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
        for line in f:
            line = line.strip()
            
            # Kanal bilgilerini içeren satır (#EXTINF)
            if line.startswith("#EXTINF:"):
                # tvg-name veya logo gibi meta verileri ve kanal adını yakala
                # Örnek: #EXTINF:-1 tvg-id="TR1" tvg-name="TRT 1",TRT 1
                current_channel = {}
                
                # Virgülden sonraki kısım genellikle kanal adıdır
                name_match = line.split(",")[-1]
                current_channel["name"] = name_match.strip() if name_match else "Bilinmeyen Kanal"
                
                # İsteğe bağlı: tvg-logo veya group-title gibi nitelikleri de regex ile çekebilirsiniz
                logo_match = re.search(r'tvg-logo="([^"]+)"', line)
                if logo_match:
                    current_channel["logo"] = logo_match.group(1)
                    
            # Linki içeren satır (Boş değilse, yorum satırı değilse ve http ile başlıyorsa)
            elif line and not line.startswith("#") and (line.startswith("http://") or line.startswith("https://")):
                if current_channel:
                    current_channel["url"] = line
                    channels.append(current_channel)
                    current_channel = {} # Bir sonraki kanal için sıfırla
                else:
                    # #EXTINF satırı olmadan direkt link geldiyse
                    channels.append({"name": "İsimsiz Kanal", "url": line})

    return channels

def main():
    m3u_file = "tv.m3u"
    channels = parse_m3u(m3u_file)
    
    if not channels:
        print("Çalma listesinde geçerli kanal bulunamadı.")
        return

    print(f"\n✅ Toplam {len(channels)} adet kanal başarıyla okundu.\n")
    
    # Örnek: İlk 5 kanalı ekrana yazdır (Doğrulama için)
    print("--- İlk 5 Kanal Listeleniyor ---")
    for i, channel in enumerate(channels[:5], 1):
        print(f"{i}. Kanal Adı: {channel['name']}")
        print(f"   URL: {channel['url']}")
        if "logo" in channel:
            print(f"   Logo: {channel['logo']}")
        print("-" * 30)

if __name__ == "__main__":
    main()
