name: Canli Mac Linkleri Guncelle

on:
  schedule:
    # Her 2 saatte bir otomatik olarak tetiklenir
    - cron: '0 */2 * * *'
  workflow_dispatch: # Elinizle istediginiz an tetiklemeniz icin buton ekler

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Gerekli Paketleri Yukle
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Kaziyici Scripti Calistir
      run: python fetch.py

    - name: Degisiklikleri Kontrol Et ve Depoya Yukle
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add events.m3u8
        # Eger yeni mac linki eklenmisse otomatik commit atar ve pushlar
        git diff --quiet && git diff --staged --quiet || (git commit -m "Mac linkleri otomatik guncellendi: $(date +'%Y-%m-%d %H:%M')" && git push)
